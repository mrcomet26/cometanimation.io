<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comet Animation Studios</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- H1 - DM Sans -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet">

<!-- H2 - Barlow -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    background-color: black;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  h1 {
    font-family: "DM Sans", sans-serif;
    font-weight: 600;
    font-size: 48px;
    letter-spacing: 2px;
    text-align: center;
    margin: 0;
  }

  h2 {
    font-family: "Barlow", sans-serif;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 16px;
    opacity: 0.7;
  }

  footer {
    position: fixed;
    bottom: 20px;
    font-family: "Barlow", sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0px;
    opacity: 0.5;
  }
</style>
</head>

<body>
  <h1>Comet Animation Studios</h1>
  <h2>A new universe in progress</h2>

  <footer>
    © <span id="year"></span> Comet Animation Studios, Inc. All Rights Reserved.
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
